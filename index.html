<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Walk - Real-time Coordinates</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; touch-action: none; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; }
        
        /* Message d'orientation */
        @media screen and (orientation: portrait) {
            #portrait-warning { display: flex; }
        }
        #portrait-warning {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; color: white; z-index: 100; justify-content: center; align-items: center; text-align: center; padding: 20px;
        }

        /* Interface des coordonnées */
        #ui-coords {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 0, 0, 0.7); color: #00ff00;
            padding: 15px; border-radius: 8px; border: 1px solid #00ff00;
            font-size: 14px; pointer-events: none; z-index: 20;
            min-width: 150px;
        }

        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; z-index: 10;
        }
        
        #loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="portrait-warning">Veuillez tourner votre appareil en mode Paysage 🔄</div>
    <div id="ui-coords">
        <strong>POSITION DU PERSO</strong><br>
        X: <span id="val-x">0.00</span><br>
        Z: <span id="val-z">0.00</span><br>
        <strong style="color: #ffff00;">Pseudo: <span id="pseudo-display">???</span></strong><br>
        <small style="color: #00aaff;">Centre (Boule): 0, 0</small>
    </div>
    
    <div id="modal-pseudo" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; display: flex; justify-content: center; align-items: center;">
        <div style="background: #222; padding: 30px; border-radius: 10px; border: 2px solid #00ff00; color: white; text-align: center; min-width: 300px;">
            <h2 style="margin-top: 0; color: #00ff00;">BIENVENUE</h2>
            <p>Entrez votre pseudo pour commencer :</p>
            <input type="text" id="input-pseudo" placeholder="Votre pseudo..." style="width: 100%; padding: 10px; margin: 10px 0; background: #333; color: white; border: 1px solid #00ff00; border-radius: 5px; font-size: 16px;" maxlength="20">
            <button id="btn-start" style="width: 100%; padding: 10px; margin-top: 10px; background: #00ff00; color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px;">DÉMARRER</button>
        </div>
    </div>
    
    <div id="audio-status" style="position: absolute; top: 20px; right: 20px; padding: 10px; background: rgba(0,0,0,0.7); color: #00ff00; border-radius: 5px; font-size: 12px; z-index: 10;">
        🎙️ Audio: <span id="audio-indicator">Initialisation...</span>
    </div>
    <div id="loader">Chargement...</div>
    <div id="joystick-zone"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { initMap } from './map.js';
        import { MultiplayerClient } from './client.js';

        let scene, camera, renderer, mixer, clock, model, controls;
        let walkAction, idleAction;
        let moveData = { active: false, angle: 0, distance: 0 };
        let beaconLight, beaconMesh;
        let multiplayerClient = null;
        let otherPlayerMeshes = {}; // { playerId: mesh }
        let playerPseudo = '';
        let localStream = null;
        let peerConnections = {};

        // Elements UI
        const elX = document.getElementById('val-x');
        const elZ = document.getElementById('val-z');
        const pseudoDisplay = document.getElementById('pseudo-display');
        const modalPseudo = document.getElementById('modal-pseudo');
        const inputPseudo = document.getElementById('input-pseudo');
        const btnStart = document.getElementById('btn-start');
        const audioIndicator = document.getElementById('audio-indicator');

        const MOVE_SPEED = 5.0; 

        // Afficher le modal au lancement
        showPseudoModal();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            scene.fog = new THREE.Fog(0x1a1a1a, 5, 45);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            clock = new THREE.Clock();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 8;
            controls.maxDistance = 8; 
            controls.enablePan = false; 

            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Point bleu fixe au centre
            beaconLight = new THREE.PointLight(0x00aaff, 5, 15);
            beaconLight.position.set(0, 1.2, 0); 
            scene.add(beaconLight);

            const beaconGeometry = new THREE.SphereGeometry(0.3, 16, 16);
            const beaconMaterial = new THREE.MeshBasicMaterial({ color: 0x00aaff });
            beaconMesh = new THREE.Mesh(beaconGeometry, beaconMaterial);
            beaconMesh.position.copy(beaconLight.position);
            scene.add(beaconMesh);

            // Sol avec grille
            const groundGroup = new THREE.Group();
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(2000, 2000), 
                new THREE.MeshStandardMaterial({ color: 0x111111 })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            groundGroup.add(ground);

            const grid = new THREE.GridHelper(1000, 100, 0x444444, 0x222222);
            grid.position.y = 0.01;
            groundGroup.add(grid);
            scene.add(groundGroup);

            // Charger la carte
            initMap(scene, THREE);

            // Initialiser le multijoueur
            initMultiplayer();

            const loader = new GLTFLoader();
            loader.load('https://threejs.org/examples/models/gltf/Soldier.glb', (gltf) => {
                model = gltf.scene;
                model.position.set(2, 0, 2); 
                scene.add(model);
                model.traverse(o => { if (o.isMesh) o.castShadow = true; });

                mixer = new THREE.AnimationMixer(model);
                idleAction = mixer.clipAction(gltf.animations[0]);
                walkAction = mixer.clipAction(gltf.animations[1]);
                
                idleAction.play();
                walkAction.play();
                walkAction.setEffectiveWeight(0);
                
                document.getElementById('loader').style.display = 'none';
                initJoystick();
                animate();
            });

            window.addEventListener('resize', onWindowResize);
        }

        function initJoystick() {
            const manager = nipplejs.create({
                zone: document.getElementById('joystick-zone'),
                mode: 'static',
                position: { left: '50%', top: '50%' },
                color: 'white', size: 100
            });

            manager.on('move', (evt, data) => {
                moveData.active = true;
                moveData.angle = data.angle.radian; 
                moveData.distance = data.distance / 50;
            });

            manager.on('end', () => { moveData.active = false; });
        }

        function updateMovement(delta) {
            if (!model || !mixer) return;

            if (moveData.active) {
                const angleCamera = Math.atan2(
                    camera.position.x - model.position.x,
                    camera.position.z - model.position.z
                );
                
                model.rotation.y = angleCamera + moveData.angle - Math.PI / 2;

                const speed = MOVE_SPEED * delta * moveData.distance;
                model.translateZ(-speed);

                walkAction.setEffectiveWeight(1);
                idleAction.setEffectiveWeight(0);
                walkAction.timeScale = moveData.distance * 1.4;

                controls.target.copy(model.position).add(new THREE.Vector3(0, 1.5, 0));
            } else {
                walkAction.setEffectiveWeight(0);
                idleAction.setEffectiveWeight(1);
                controls.target.copy(model.position).add(new THREE.Vector3(0, 1.5, 0));
            }

            // MISE À JOUR UI
            elX.innerText = model.position.x.toFixed(2);
            elZ.innerText = model.position.z.toFixed(2);

            // Envoyer la position au serveur multijoueur
            if (multiplayerClient) {
                multiplayerClient.sendPlayerUpdate(
                    model.position,
                    model.rotation.y,
                    moveData.active ? 'walk' : 'idle'
                );
            }
        }

        function updateBeacon(elapsedTime) {
            if (beaconLight) {
                const intensity = Math.sin(elapsedTime * 4) * 2.5 + 3.5;
                beaconLight.intensity = intensity;
                const scale = Math.sin(elapsedTime * 4) * 0.05 + 1.0;
                beaconMesh.scale.set(scale, scale, scale);
            }
        }

        async function initMultiplayer() {
            try {
                multiplayerClient = new MultiplayerClient('http://localhost:3000');
                await multiplayerClient.connect(playerPseudo);
                
                multiplayerClient.onPlayerJoined = (player) => {
                    console.log('Nouvel joueur:', player.pseudo);
                    createOtherPlayerMesh(player.id, player.pseudo);
                };
                
                multiplayerClient.onPlayerUpdate = (data) => {
                    updateOtherPlayerMesh(data.id, data.position, data.rotation);
                };
                
                multiplayerClient.onPlayerDisconnected = (playerId) => {
                    console.log('Joueur déconnecté:', playerId);
                    removeOtherPlayerMesh(playerId);
                };
                
                console.log('[✓] Multijoueur initialisé');
            } catch (error) {
                console.error('[✗] Erreur multijoueur:', error);
                // Continuer même si serveur non disponible
            }
        }

        function createOtherPlayerMesh(playerId, pseudo = 'Joueur') {
            // Créer une sphère simple pour représenter l'autre joueur
            const geometry = new THREE.CylinderGeometry(0.7, 0.7, 1.8, 8);
            const material = new THREE.MeshStandardMaterial({ 
                color: Math.random() * 0xffffff 
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(0, 0.9, 0);
            mesh.castShadow = true;
            scene.add(mesh);
            
            // Créer une étiquette avec le pseudo
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff00';
            ctx.font = 'Bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(pseudo, canvas.width / 2, canvas.height / 2 + 12);
            
            const texture = new THREE.CanvasTexture(canvas);
            const labelGeometry = new THREE.PlaneGeometry(3, 0.75);
            const labelMaterial = new THREE.MeshBasicMaterial({ map: texture });
            const label = new THREE.Mesh(labelGeometry, labelMaterial);
            label.position.y = 2.5;
            mesh.add(label);
            
            otherPlayerMeshes[playerId] = {
                mesh: mesh,
                position: new THREE.Vector3(0, 0, 0),
                rotation: 0,
                pseudo: pseudo
            };
        }

        function updateOtherPlayerMesh(playerId, position, rotation) {
            if (otherPlayerMeshes[playerId]) {
                otherPlayerMeshes[playerId].mesh.position.copy(position);
                otherPlayerMeshes[playerId].mesh.position.y += 0.9;
                otherPlayerMeshes[playerId].mesh.rotation.y = rotation;
            }
        }

        function removeOtherPlayerMesh(playerId) {
            if (otherPlayerMeshes[playerId]) {
                scene.remove(otherPlayerMeshes[playerId].mesh);
                delete otherPlayerMeshes[playerId];
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function showPseudoModal() {
            modalPseudo.style.display = 'flex';
            inputPseudo.focus();
            
            btnStart.onclick = () => {
                playerPseudo = inputPseudo.value.trim() || 'Joueur' + Math.floor(Math.random() * 1000);
                pseudoDisplay.innerText = playerPseudo;
                modalPseudo.style.display = 'none';
                
                initAudio();
                init();
            };
            
            inputPseudo.onkeypress = (e) => {
                if (e.key === 'Enter') btnStart.click();
            };
        }

        async function initAudio() {
            try {
                audioIndicator.innerText = 'Demande d\'accès...';
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                audioIndicator.innerText = '🎙️ Actif';
                audioIndicator.style.color = '#00ff00';
                console.log('[✓] Microphone autorisé');
            } catch (error) {
                console.error('[✗] Erreur audio:', error);
                audioIndicator.innerText = '❌ Refusé';
                audioIndicator.style.color = '#ff0000';
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime(); 
            
            if (mixer) mixer.update(delta);
            updateMovement(delta);
            updateBeacon(elapsedTime);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
